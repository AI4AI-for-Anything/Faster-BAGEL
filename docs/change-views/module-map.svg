   <g id="text_1">
    <text style="fill: #292122; font: 700 23px 'DejaVu Sans'; text-anchor: start" x="35.64" y="36.72" transform="rotate(-0 35.64 36.72)">What changed in Faster-BAGEL</text>
   </g>
   <g id="text_2">
    <text style="fill: #8c0000; font: 700 11px 'DejaVu Sans'; text-anchor: start" x="44.712" y="95.472" transform="rotate(-0 44.712 95.472)">01</text>
   </g>
   <g id="text_3">
    <text style="fill: #79696b; font: 10px 'DejaVu Sans'; text-anchor: end" x="301.32" y="95.472" transform="rotate(-0 301.32 95.472)">3 files</text>
   </g>
   <g id="text_4">
    <text style="fill: #292122; font: 700 12.5px 'DejaVu Sans'; text-anchor: start" x="44.712" y="117.9936" transform="rotate(-0 44.712 117.9936)">Memory and recomputation</text>
   </g>
   <g id="text_5">
    <text style="fill: #292122; font: 10.2px 'DejaVu Sans'" transform="translate(44.712 151.203206)">No outer activation recomputation</text>
    <text style="fill: #292122; font: 10.2px 'DejaVu Sans'" transform="translate(44.712 165.725138)">Lean checkpoints for norms and SwiGLU,</text>
    <text style="fill: #292122; font: 10.2px 'DejaVu Sans'" transform="translate(44.712 180.247069)">MLP recompute in compiled regions</text>
   </g>
   <g id="text_6">
    <text style="fill: #79696b; font: 9.2px 'DejaVu Sans'" transform="translate(44.712 217.041937)">train/fsdp_utils.py</text>
    <text style="fill: #79696b; font: 9.2px 'DejaVu Sans'" transform="translate(44.712 229.696969)">modeling/bagel/qwen2_navit.py</text>
    <text style="fill: #79696b; font: 9.2px 'DejaVu Sans'" transform="translate(44.712 242.352)">modeling/bagel/fused_layer.py</text>
   </g>
   <g id="text_7">
    <text style="fill: #8c0000; font: 700 11px 'DejaVu Sans'; text-anchor: start" x="339.552" y="95.472" transform="rotate(-0 339.552 95.472)">02</text>
   </g>
   <g id="text_8">
    <text style="fill: #79696b; font: 10px 'DejaVu Sans'; text-anchor: end" x="596.16" y="95.472" transform="rotate(-0 596.16 95.472)">3 files</text>
   </g>
   <g id="text_9">
    <text style="fill: #292122; font: 700 12.5px 'DejaVu Sans'; text-anchor: start" x="339.552" y="117.9936" transform="rotate(-0 339.552 117.9936)">Mixture-of-transformers layers</text>
   </g>
   <g id="text_10">
    <text style="fill: #292122; font: 10.2px 'DejaVu Sans'" transform="translate(339.552 151.203206)">Residual stream kept in expert order</text>
    <text style="fill: #292122; font: 10.2px 'DejaVu Sans'" transform="translate(339.552 165.725138)">Compiled elementwise ops and</text>
    <text style="fill: #292122; font: 10.2px 'DejaVu Sans'" transform="translate(339.552 180.247069)">two-region decoder layers · tuned Flex</text>
   </g>
   <g id="text_11">
    <text style="fill: #79696b; font: 9.2px 'DejaVu Sans'" transform="translate(339.552 217.041937)">modeling/bagel/qwen2_navit.py</text>
    <text style="fill: #79696b; font: 9.2px 'DejaVu Sans'" transform="translate(339.552 229.696969)">modeling/bagel/fused_ops.py</text>
    <text style="fill: #79696b; font: 9.2px 'DejaVu Sans'" transform="translate(339.552 242.352)">modeling/bagel/fused_layer.py</text>
   </g>
   <g id="text_12">
    <text style="fill: #8c0000; font: 700 11px 'DejaVu Sans'; text-anchor: start" x="44.712" y="301.104" transform="rotate(-0 44.712 301.104)">03</text>
   </g>
   <g id="text_13">
    <text style="fill: #79696b; font: 10px 'DejaVu Sans'; text-anchor: end" x="301.32" y="301.104" transform="rotate(-0 301.32 301.104)">3 files</text>
   </g>
   <g id="text_14">
    <text style="fill: #292122; font: 700 12.5px 'DejaVu Sans'; text-anchor: start" x="44.712" y="323.6256" transform="rotate(-0 44.712 323.6256)">FSDP and balancing</text>
   </g>
   <g id="text_15">
    <text style="fill: #292122; font: 10.2px 'DejaVu Sans'" transform="translate(44.712 356.835206)">Forward prefetch · one post-divide</text>
    <text style="fill: #292122; font: 10.2px 'DejaVu Sans'" transform="translate(44.712 371.357137)">ViT kept gathered for backward</text>
    <text style="fill: #292122; font: 10.2px 'DejaVu Sans'" transform="translate(44.712 385.879069)">Fused AdamW · whole-document LM balancing</text>
   </g>
   <g id="text_16">
    <text style="fill: #79696b; font: 9.2px 'DejaVu Sans'" transform="translate(44.712 422.673937)">train/fsdp_utils.py</text>
    <text style="fill: #79696b; font: 9.2px 'DejaVu Sans'" transform="translate(44.712 435.328969)">modeling/bagel/lm_balance.py</text>
    <text style="fill: #79696b; font: 9.2px 'DejaVu Sans'" transform="translate(44.712 447.984)">modeling/bagel/bagel.py</text>
   </g>
   <g id="text_17">
    <text style="fill: #8c0000; font: 700 11px 'DejaVu Sans'; text-anchor: start" x="339.552" y="301.104" transform="rotate(-0 339.552 301.104)">04</text>
   </g>
   <g id="text_18">
    <text style="fill: #79696b; font: 10px 'DejaVu Sans'; text-anchor: end" x="596.16" y="301.104" transform="rotate(-0 596.16 301.104)">7 files</text>
   </g>
   <g id="text_19">
    <text style="fill: #292122; font: 700 12.5px 'DejaVu Sans'; text-anchor: start" x="339.552" y="323.6256" transform="rotate(-0 339.552 323.6256)">Host path and ViT</text>
   </g>
   <g id="text_20">
    <text style="fill: #292122; font: 10.2px 'DejaVu Sans'" transform="translate(339.552 356.835206)">Hand-written SigLIP layer backward</text>
    <text style="fill: #292122; font: 10.2px 'DejaVu Sans'" transform="translate(339.552 371.357137)">VAE encode on a side stream</text>
    <text style="fill: #292122; font: 10.2px 'DejaVu Sans'" transform="translate(339.552 385.879069)">Deferred metric syncs, fewer host syncs</text>
   </g>
   <g id="text_21">
    <text style="fill: #79696b; font: 9.2px 'DejaVu Sans'" transform="translate(339.552 422.673937)">modeling/bagel/: vit_layer_fn.py · siglip_navit.py</text>
    <text style="fill: #79696b; font: 9.2px 'DejaVu Sans'" transform="translate(339.552 435.328969)">modeling/autoencoder.py · train/async_log.py</text>
    <text style="fill: #79696b; font: 9.2px 'DejaVu Sans'" transform="translate(339.552 447.984)">data/: data_utils.py · dataset_base.py</text>
   </g>
   <g id="text_22">
    <text style="fill: #79696b; font: 9.5px 'DejaVu Sans'; text-anchor: start" x="35.64" y="479.808" transform="rotate(-0 35.64 479.808)">Every switch is off by default; directions that were tried and rejected stay in the code, switched off.</text>
   </g>
  </g>
