  </g>
  <g id="text_19">
   <text style="fill: #292122; font: 700 21.5px 'DejaVu Sans'; text-anchor: start" x="58.32" y="56.88" transform="rotate(-0 58.32 56.88)">Agent Optimization History</text>
  </g>
  <g id="text_20">
   <text style="fill: #8c0000; font: 700 29px 'DejaVu Sans'; text-anchor: end" x="609.12" y="46.8" transform="rotate(-0 609.12 46.8)">1.82×</text>
  </g>
  <g id="text_21">
   <text style="fill: #79696b; font: 10.5px 'DejaVu Sans'; text-anchor: end" x="609.12" y="63.36" transform="rotate(-0 609.12 63.36)">step speedup</text>
  </g>
  <g id="text_22">
   <text style="fill: #79696b; font: 11px 'DejaVu Sans'; text-anchor: start" x="58.32" y="94.32" transform="rotate(-0 58.32 94.32)">Cumulative full-check speedup · 8 Hopper GPUs · 6 certified milestones in 33 rounds · M7 rejected</text>
  </g>
  <g id="text_23">
   <text style="fill: #8c0000; font: 700 11.5px 'DejaVu Sans'; text-anchor: start" x="67.392" y="388.373281" transform="rotate(-0 67.392 388.373281)">M1</text>
  </g>
  <g id="text_24">
   <text style="fill: #292122; font: 700 9.6px 'DejaVu Sans'" transform="translate(100.44 382.401105)">No LM recomputation, lean checkpoints,</text>
   <text style="fill: #292122; font: 700 9.6px 'DejaVu Sans'" transform="translate(100.44 393.296895)">expert-ordered MoT stream, FSDP prefetch</text>
  </g>
  <g id="text_25">
   <text style="fill: #8c0000; font: 700 11.5px 'DejaVu Sans'; text-anchor: start" x="352.512" y="388.373281" transform="rotate(-0 352.512 388.373281)">M2</text>
  </g>
  <g id="text_26">
   <text style="fill: #292122; font: 700 9.6px 'DejaVu Sans'" transform="translate(385.56 382.363605)">Compiled elementwise ops and decoder</text>
   <text style="fill: #292122; font: 700 9.6px 'DejaVu Sans'" transform="translate(385.56 393.259395)">regions, FSDP post-divide, fused AdamW</text>
  </g>
  <g id="text_27">
   <text style="fill: #8c0000; font: 700 11.5px 'DejaVu Sans'; text-anchor: start" x="67.392" y="444.533281" transform="rotate(-0 67.392 444.533281)">M3</text>
  </g>
  <g id="text_28">
   <text style="fill: #292122; font: 700 9.6px 'DejaVu Sans'" transform="translate(100.44 438.523605)">No outer recomputation; MLP recomputed</text>
   <text style="fill: #292122; font: 700 9.6px 'DejaVu Sans'" transform="translate(100.44 449.419395)">inside compiled regions</text>
  </g>
  <g id="text_29">
   <text style="fill: #8c0000; font: 700 11.5px 'DejaVu Sans'; text-anchor: start" x="352.512" y="444.533281" transform="rotate(-0 352.512 444.533281)">M4</text>
  </g>
  <g id="text_30">
   <text style="fill: #292122; font: 700 9.6px 'DejaVu Sans'" transform="translate(385.56 438.486105)">ViT kept gathered, tuned FlexAttention,</text>
   <text style="fill: #292122; font: 700 9.6px 'DejaVu Sans'" transform="translate(385.56 449.456895)">hand-written ViT backward, async VAE</text>
  </g>
  <g id="text_31">
   <text style="fill: #8c0000; font: 700 11.5px 'DejaVu Sans'; text-anchor: start" x="67.392" y="500.693281" transform="rotate(-0 67.392 500.693281)">M5</text>
  </g>
  <g id="text_32">
   <text style="fill: #292122; font: 700 9.6px 'DejaVu Sans'" transform="translate(100.44 494.646105)">Fewer host syncs, deferred logging</text>
   <text style="fill: #292122; font: 700 9.6px 'DejaVu Sans'" transform="translate(100.44 505.616895)">synchronization</text>
  </g>
  <g id="text_33">
   <text style="fill: #8c0000; font: 700 11.5px 'DejaVu Sans'; text-anchor: start" x="352.512" y="500.693281" transform="rotate(-0 352.512 500.693281)">M6</text>
  </g>
  <g id="text_34">
   <text style="fill: #292122; font: 700 9.6px 'DejaVu Sans'; text-anchor: start" x="385.56" y="500.1315" transform="rotate(-0 385.56 500.1315)">Reversible whole-document LM balancing</text>
  </g>
  <g id="text_35">
   <text style="fill: #79696b; font: 9.3px 'DejaVu Sans'" transform="translate(58.32 548.74545)">Each point is a full check by the same frozen judge on the same host; M1 is bitwise identical to the reference,</text>
   <text style="fill: #79696b; font: 9.3px 'DejaVu Sans'" transform="translate(58.32 560.572725)">M2–M6 passed the statistical gate. M7 timed faster but the gate found a real deviation, so it was rejected.</text>
   <text style="fill: #79696b; font: 9.3px 'DejaVu Sans'" transform="translate(58.32 572.4)">Cumulative configurations, not isolated ablations. Target was 3×.</text>
  </g>
 </g>
